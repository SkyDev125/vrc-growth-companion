name: Build desktop installers
on:
  push:
    branches: [main]
    paths:
      - companion/measurement_format.py
      - companion/measurement-units.json
      - companion/measurement-examples.json
      - .github/workflows/companion-desktop.yml
      - companion/growth_options.py
      - companion/smooth_growth.py
      - companion/avatar_mapping.py
      - companion/ui/**
      - companion/desktop.py
      - companion/vrchat_companion.py
      - companion/build-desktop.py
      - companion/macos_image.py
      - companion/updater.py
      - companion/update_controller.py
      - companion/update-assets/**
      - companion/smoke-desktop.py
      - companion/windows-installer.iss
      - companion/test_*.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyinstaller==6.22.3 zeroconf==0.154.0 PySide6-Essentials==6.12.0 cryptography==50.0.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-shm0 libxcb-render0 libxcb-glx0 libxcb-xkb1
      - run: python -m unittest discover -s companion -p 'test_*.py' -v
      - if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH += ';C:\Program Files (x86)\Inno Setup 6'
          python companion/build-desktop.py
      - if: runner.os != 'Windows'
        run: python companion/build-desktop.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python companion/smoke-desktop.py
      - if: runner.os != 'Linux'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -u companion/smoke-desktop.py
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p artifacts
          case '${{ matrix.target }}' in
            windows-x64) cp public/downloads/mids-den-companion-windows-setup.exe artifacts/ ;;
            macos-*) cp public/downloads/mids-den-companion-macos.dmg artifacts/mids-den-companion-${{ matrix.target }}.dmg ;;
            linux-x64) cp public/downloads/MidsDenCompanion artifacts/mids-den-companion-linux-x64 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
  release:
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          gh release create "desktop-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" ./* --target "$BUILD_SHA" --title "Desktop build ${GITHUB_RUN_NUMBER}" --notes "Self-contained Windows setup, macOS disk images (Apple Silicon and Intel), and Linux x64 application. Each app passes native Qt, SSL, and OSC smoke checks. Builds are unsigned."
